<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="drop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Background with safe zone rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Soil base curved lines -->
  <path d="M96 380 Q 256 360 416 380" stroke="#86efac" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M128 410 Q 256 395 384 410" stroke="#86efac" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.25"/>

  <!-- Plant Stem and Leaves -->
  <path d="M256 380 V 220" stroke="#22c55e" stroke-width="14" stroke-linecap="round"/>
  <!-- Left Leaf -->
  <path d="M256 300 C 180 290 140 220 160 170 C 220 170 250 240 256 300 Z" fill="url(#leaf)"/>
  <!-- Right Leaf -->
  <path d="M256 260 C 332 250 372 180 352 130 C 292 130 262 200 256 260 Z" fill="url(#leaf)"/>

  <!-- Water Drop / Moisture Sensor Indicator -->
  <path d="M256 120 C 256 120 286 160 286 182 C 286 198 272 212 256 212 C 240 212 226 198 226 182 C 226 160 256 120 256 120 Z" fill="url(#drop)"/>

  <!-- Wireless / Sensor Wave rings -->
  <path d="M370 190 A 40 40 0 0 1 390 230" fill="none" stroke="#67e8f9" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <path d="M390 165 A 70 70 0 0 1 425 235" fill="none" stroke="#67e8f9" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Subtle Inner Shield / Safe ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.1"/>
</svg>
